<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ver Categoría - Todos los artículos de la página ordenados por categoría.</title>
    <meta name="description" content="Visualiza todos los artículos del sitio web ordenados según la categoría elegida, la cual puede ser plantas, alimentos, ejercicio o bienestar.">
    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/tisanatur/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/tisanatur/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/tisanatur/favicon-16x16.png">
    <link rel="manifest" href="/tisanatur/site.webmanifest">
    <link rel="mask-icon" href="/tisanatur/safari-pinned-tab.svg" color="#5bbad5">
    <meta name="msapplication-TileColor" content="#da532c">
    <meta name="theme-color" content="#ffffff">
    <!-- Tipografía: Edu AU VIC WA NT Hand -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Edu+AU+VIC+WA+NT+Hand:wght@400..700&display=swap" rel="stylesheet">
    <!-- Tipografía: Roboto -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
    <!-- Estilos Propios -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div data-include="header.html"></div>
    <main>
        <div class="contain-panel">
            <div class="contain-latest">
                <h1 id="title-categoria"></h1>
                <section class="latest">        
                    <template id="post-template">
                        <article class="post">
                            <h3 class="title-h3"></h3>
                            <h4 class="title-h4"></h4>
                            <p class="description"></p>
                            <a href="#" class="button-link">Leer Más</a>
                        </article>
                    </template>
                </section>
                <nav id="pagination">
                    <button id="prev">Anterior</button>
                    <span id="page-info"></span>
                    <button id="next">Siguiente</button>
                </nav>
            </div>
            <aside class="contain-popular">
                <h2 class="title-h2">más populares</h2>
                <section class="popular">
                    <ul class="list-popular">
                        <!--<li class="item-popular"><a href=""><p></p></a></li>-->
                    </ul>            
                </section>
            </aside>
        </div>       
    </main>
    <footer class="footer-main">
        <h4>Copyright &copy; 2024 eduwebM - Todos los derechos reservados</h4>
    </footer>
    <button class="dark-theme-btn" title="Oscurecer">🌕</button>
    <script src="assets/js/index.js" type="module" defer></script>
</body>
</html>
